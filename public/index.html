<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: usa toda la pantalla del iPhone (notch incluido); sin zoom para que los gestos no muevan la página -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Tetris</title>

    <!-- Instalación como app en iPhone ("Agregar a pantalla de inicio") -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tetris" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #0b0e1a;
      }
      body {
        overflow: hidden;
        /* Evita el "rebote", la selección de texto y el menú al mantener presionado en iOS */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para jugar.</noscript>
    <div id="root"></div>
  </body>
</html>
